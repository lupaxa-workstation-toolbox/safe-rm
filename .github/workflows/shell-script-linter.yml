name: Shell Script Linter

on:
  push:
    paths:
      - ".github/workflows/shell-script-linter.yml"
      - "src/safe-rm"
      - "**/*.sh"
      - "**/*.bash"
      - "**/*.bats"

  pull_request:
    branches:
      - "main"
      - "master"
    paths:
      - ".github/workflows/shell-script-linter.yml"
      - "src/safe-rm"
      - "**/*.sh"
      - "**/*.bash"
      - "**/*.bats"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  shell-scripts-linter:
    name: Shell Scripts Linter
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-shell-script-linter.yml@master
    with:
      include_files: "src/safe-rm"
    secrets: inherit

  generate-workflow-summary:
    name: Generate Workflow Summary
    needs:
      - shell-scripts-linter
    if: always()
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-workflow-summary.yml@master

  generate-workflow-notifications:
    name: Generate Workflow Notifications
    needs:
      - generate-workflow-summary
    if: always()
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-workflow-notifier.yml@master
    with:
      notify_on_results: "failure,timed_out"
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
